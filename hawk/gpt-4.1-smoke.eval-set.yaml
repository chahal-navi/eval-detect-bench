# EvalDetectBench on Hawk, GPT-4.1 as judge: 20-sample smoke run.
# Direct OpenAI on Hawk; the paper used OpenRouter, which forwards the same prompt.
#   hawk eval-set run hawk/gpt-4.1-smoke.eval-set.yaml
name: edb-gpt41-smoke
tasks:
  - package: "git+https://github.com/chahal-navi/eval-detect-bench@98997ac9a89f34b8b3bc1cd959faa7094523a2e2"
    name: eval_detect_bench
    items:
      - name: eval_detect_bench
models:
  - package: openai
    name: openai
    items:
      - name: gpt-4.1
limit: 20
epochs: 1
max_retries: 5
runner:
  cpu: "1"
  memory: 4Gi
